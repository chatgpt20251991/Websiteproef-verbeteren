name: SJA Sunburst MAX statement 2026 final cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sja-sunburst-statement-final-20260918.yml'
      - 'sja-sunburst-statement-final-20260918/**'
permissions:
  contents: read
  actions: read
concurrency:
  group: sja-sunburst-statement-final-20260918
  cancel-in-progress: false
jobs:
  mockup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install image transport dependencies
        run: python3 -m pip install --disable-pip-version-check requests==2.32.5 Pillow==11.3.0
      - name: Retrieve the completed mockup for targeted cleanup
        env:
          GH_ARTIFACT_TOKEN: ${{ github.token }}
        run: python3 sja-sunburst-statement-final-20260918/fetch_reference.py
      - name: Validate original website references without API request
        run: python3 sja-sunburst-statement-final-20260918/generate_mockup.py --validate-only
      - name: Generate one native MAX mockup
        env:
          OPENAI_API_KEY: ${{ secrets.AVIN2 }}
        run: python3 sja-sunburst-statement-final-20260918/generate_mockup.py
      - name: Preserve original generated output and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sja-sunburst-statement-final-20260918
          path: sunburst-statement-final-output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

