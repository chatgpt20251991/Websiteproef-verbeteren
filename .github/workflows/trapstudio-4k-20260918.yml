name: TrapStudio 4K verified source images
on:
  push:
    branches: ['trapstudio-4k-20260918']
    paths: ['.github/workflows/trapstudio-4k-20260918.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trapstudio-4k-source-images
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image inspection dependencies
        run: python -m pip install 'requests==2.32.5' 'Pillow==11.3.0'
      - name: Verify composition-reference bytes
        run: |
          python - <<'PY'
          import base64, hashlib, io
          from pathlib import Path
          from PIL import Image
          raw=base64.b64decode(Path('trapstudio-4k/layout-reference.webp.b64').read_text().strip(),validate=True)
          assert hashlib.sha256(raw).hexdigest()=='940ee798a996ec442a5d52645e43d37999de8c5b2b84ec456888c5b8a809e2b7'
          im=Image.open(io.BytesIO(raw));im.verify()
          print('Layout reference verified. This is NOT a 4K output image.')
          PY
      - name: Produce six actual 3840x2160 API source images
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PYTHONUNBUFFERED: '1'
        run: python trapstudio-4k/render.py
      - name: Preserve original images and request metadata, even on partial failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trapstudio-4k-originals-${{ github.run_id }}
          path: trapstudio-4k-output/
          retention-days: 90
          compression-level: 0
          if-no-files-found: warn
