name: SJA Sunburst MAX editorial landing revision
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sja-sunburst-suite-editorial-20260918.yml'
      - 'sja-sunburst-suite-editorial-20260918/**'
permissions:
  contents: read
  actions: read
jobs:
  editorial:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install dependencies
        run: python3 -m pip install --disable-pip-version-check requests==2.32.5 Pillow==11.3.0
      - name: Retrieve exact dashboard design master
        env:
          GH_ARTIFACT_TOKEN: ${{ github.token }}
        run: python3 sja-sunburst-suite-editorial-20260918/fetch_reference.py
      - name: Generate a different editorial desktop layout
        env:
          OPENAI_API_KEY: ${{ secrets.AVIN2 }}
        run: python3 sja-sunburst-suite-editorial-20260918/generate_suite.py --stage desktop
      - name: Preserve desktop for inspection
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sja-editorial-desktop-20260918
          path: sunburst-suite-editorial-output/
          retention-days: 14
          compression-level: 0
      - name: Generate matching mobile landing segments
        env:
          OPENAI_API_KEY: ${{ secrets.AVIN2 }}
        run: python3 sja-sunburst-suite-editorial-20260918/generate_suite.py --stage mobile
      - name: Preserve editorial landing designs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sja-editorial-complete-20260918
          path: sunburst-suite-editorial-output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
