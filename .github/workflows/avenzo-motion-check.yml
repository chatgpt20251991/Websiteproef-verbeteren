name: Validate Avenzo motion patch (no deployment)
on:
  push:
    branches: [avenzo-motion-20260909]
    paths: ['motion-refresh/**', '.github/workflows/avenzo-motion-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install Pillow==11.3.0
      - run: node --check motion-refresh/assets/avenzo-motion-20260909.js
      - run: python -m unittest discover -s motion-refresh/tests -p 'test_*.py' -v
      - run: python -m unittest discover -s brand-refresh/tests -v
      - name: Read current pages and prepare candidate; never publish
        run: |
          python brand-refresh/prepare_candidate.py
          python motion-refresh/apply.py --source brand-refresh-candidate --output motion-candidate
      - uses: actions/upload-artifact@v4
        with:
          name: avenzo-motion-patch-not-live
          path: motion-candidate/
          retention-days: 14
