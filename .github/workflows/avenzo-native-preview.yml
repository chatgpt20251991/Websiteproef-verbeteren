name: Avenzo native scene proofs
on:
  push:
    paths:
      - '.github/workflows/avenzo-native-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare verified native renderer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/renderer
          cd /tmp/renderer
          curl -fsSL --retry 2 --max-time 180 -O https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          curl -fsSL --retry 2 --max-time 60 -o published.sha256 https://download.blender.org/release/Blender4.2/blender-4.2.3.sha256
          grep 'blender-4.2.3-linux-x64.tar.xz$' published.sha256 | sha256sum --check
          tar -xf blender-4.2.3-linux-x64.tar.xz
      - name: Correct material socket in the temporary build only
        run: |
          sed -i 's/Anisotropic IOR Level/Anisotropic/g' native-4k/render.py
          python3 -m py_compile native-4k/render.py
      - name: Render original scene proofs
        run: |
          /tmp/renderer/blender-4.2.3-linux-x64/blender -b -t 4 --python-exit-code 1 --python native-4k/render.py -- --scene hero-desktop-apps --width 960 --samples 16 --output native-proofs
          /tmp/renderer/blender-4.2.3-linux-x64/blender -b -t 4 --python-exit-code 1 --python native-4k/render.py -- --scene service-web --width 960 --samples 16 --output native-proofs
          test -s native-proofs/hero-desktop-apps.png
          test -s native-proofs/service-web.png
          cp native-4k/render.py native-proofs/render.py
      - name: Preserve render proofs and evidence without deployment
        uses: actions/upload-artifact@v4
        with:
          name: avenzo-native-scene-proofs
          path: native-proofs/
          retention-days: 7
          if-no-files-found: error
