name: Prepare offline cinematic render tool
on:
  push:
    branches: [avenzo-cinema-20260909]
    paths: ['.github/workflows/avenzo-cinema-renderer.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fetch pinned official Blender release for local rendering only
        run: |
          mkdir renderer
          curl --fail --location --retry 2 --max-time 160 'https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz' -o renderer/blender-4.5.3-linux-x64.tar.xz
          sha256sum renderer/blender-4.5.3-linux-x64.tar.xz > renderer/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: avenzo-internal-renderer
          path: renderer/
          retention-days: 1
          compression-level: 0
