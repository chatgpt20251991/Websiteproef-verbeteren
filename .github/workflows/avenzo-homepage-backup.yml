name: Back up publicly served Avenzo text assets

on:
  push:
    paths:
      - '.github/workflows/avenzo-homepage-backup.yml'
  workflow_dispatch:

# Writes only public HTML/CSS/JS snapshots to this repository. Never deploys.
permissions:
  contents: write

concurrency:
  group: avenzo-public-homepage-backup
  cancel-in-progress: false

jobs:
  public-homepage-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Save public site text without changing hosting or mail
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          """Back up public site text only; never modify DNS, hosting or mail."""
          import base64
          import hashlib
          import json
          import os
          import re
          from datetime import datetime, timezone
          from urllib.error import HTTPError
          from urllib.parse import quote, urlparse
          from urllib.request import Request, urlopen
          
          URL = 'https://avenzodigital.nl/'
          REPOSITORY = 'chatgpt20251991/Websiteproef-verbeteren'
          LIMIT = 1048576
          
          def api(method, path, data=None):
              payload = None if data is None else json.dumps(data).encode()
              req = Request('https://api.github.com/repos/' + REPOSITORY + path, data=payload, method=method, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'AvenzoRecovery/1.0'})
              with urlopen(req, timeout=20) as response:
                  return json.load(response)
          
          def save(path, content):
              route = '/contents/' + quote(path, safe='/')
              update = {'message': 'Back up publicly served Avenzo text (not a deployment)', 'content': base64.b64encode(content).decode()}
              try:
                  old = api('GET', route)
                  if base64.b64decode(old.get('content', '')) == content:
                      return {'path': path, 'unchanged': True}
                  update['sha'] = old['sha']
              except HTTPError as exc:
                  if exc.code != 404:
                      raise
              result = api('PUT', route, update)
              return {'path': path, 'commit': result['commit']['sha']}
          
          def main():
              resources = [
                  ('/', 'recovery/published-homepage.html', 'html'),
                  ('/contact/', 'recovery/published-contact.html', 'html'),
                  ('/assets/compiled/app.15bbad9d28a8afd3.js', 'recovery/published-app.js', 'javascript'),
                  ('/assets/compiled/site.b558cdf825c04438.css', 'recovery/published-site.css', 'css'),
              ]
              observed, saved = [], []
              for path, destination, kind in resources:
                  source_url = URL.rstrip('/') + path
                  req = Request(source_url, headers={'User-Agent': 'AvenzoRecovery/1.0'})
                  with urlopen(req, timeout=20) as response:
                      data = response.read(LIMIT + 1)
                      final_url = response.geturl()
                      content_type = response.headers.get('Content-Type', '')
                      status = response.status
                  if len(data) > LIMIT or status != 200 or kind not in content_type.lower():
                      raise RuntimeError('Unexpected public resource response: ' + path)
                  if urlparse(final_url).hostname not in {'avenzodigital.nl', 'www.avenzodigital.nl'}:
                      raise RuntimeError('Unexpected redirect: ' + path)
                  text = data.decode('utf-8')
                  title = re.search(r'<title[^>]*>(.*?)</title>', text, flags=re.I | re.S) if kind == 'html' else None
                  if kind == 'html' and (not title or 'avenzo' not in title.group(1).lower()):
                      raise RuntimeError('Page identity check failed: ' + path)
                  if re.search(r'data:(?:font/|application/(?:font|x-font)|[^;,]*(?:woff|ttf|otf))', text, flags=re.I):
                      raise RuntimeError('Embedded font data detected; snapshot stopped: ' + path)
                  observed.append({'checked_at_utc': datetime.now(timezone.utc).isoformat(), 'source_url': source_url, 'final_url': final_url, 'status': status, 'content_type': content_type, 'title': title.group(1) if title else None, 'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data)})
                  saved.append(save(destination, data))
              report = {'scope': 'Publicly served HTML, CSS and JavaScript snapshots only. Not original project source. No images or font files copied. No deployment, DNS, mail or recurring tasks modified.', 'observations': observed, 'saved': saved}
              saved.append(save('recovery/public-text-backup-observations.json', (json.dumps(report, indent=2) + '\n').encode()))
              print(json.dumps(report, indent=2))
          
          if __name__ == '__main__':
              main()
          PY
