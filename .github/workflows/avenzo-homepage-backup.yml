name: Back up publicly served Avenzo homepage

on:
  push:
    paths:
      - '.github/workflows/avenzo-homepage-backup.yml'
  workflow_dispatch:

# Writes only a public HTML snapshot to this repository. Never deploys.
permissions:
  contents: write

concurrency:
  group: avenzo-public-homepage-backup
  cancel-in-progress: false

jobs:
  public-homepage-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Save public homepage snapshot without changing hosting or mail
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          python3 - <<'PY'
          """Back up the public homepage only; never modify DNS, hosting or mail."""
          import base64
          import hashlib
          import json
          import os
          import re
          from datetime import datetime, timezone
          from urllib.error import HTTPError
          from urllib.parse import quote, urlparse
          from urllib.request import Request, urlopen
          
          URL = 'https://avenzodigital.nl/'
          REPOSITORY = 'chatgpt20251991/Websiteproef-verbeteren'
          LIMIT = 1048576
          
          def api(method, path, data=None):
              payload = None if data is None else json.dumps(data).encode()
              req = Request('https://api.github.com/repos/' + REPOSITORY + path, data=payload, method=method, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28', 'User-Agent': 'AvenzoRecovery/1.0'})
              with urlopen(req, timeout=20) as response:
                  return json.load(response)
          
          def save(path, content):
              route = '/contents/' + quote(path, safe='/')
              update = {'message': 'Back up publicly served Avenzo homepage (not a deployment)', 'content': base64.b64encode(content).decode()}
              try:
                  old = api('GET', route)
                  if base64.b64decode(old.get('content', '')) == content:
                      return {'path': path, 'unchanged': True}
                  update['sha'] = old['sha']
              except HTTPError as exc:
                  if exc.code != 404:
                      raise
              result = api('PUT', route, update)
              return {'path': path, 'commit': result['commit']['sha']}
          
          def main():
              req = Request(URL, headers={'User-Agent': 'AvenzoRecovery/1.0', 'Accept': 'text/html'})
              with urlopen(req, timeout=20) as response:
                  data = response.read(LIMIT + 1)
                  final_url = response.geturl()
                  content_type = response.headers.get('Content-Type', '')
                  status = response.status
              if len(data) > LIMIT or status != 200 or 'html' not in content_type.lower():
                  raise RuntimeError('Unexpected homepage response; nothing saved')
              if urlparse(final_url).hostname not in {'avenzodigital.nl', 'www.avenzodigital.nl'}:
                  raise RuntimeError('Unexpected redirect; nothing saved')
              html = data.decode('utf-8')
              title = re.search(r'<title[^>]*>(.*?)</title>', html, flags=re.I | re.S)
              if not title or 'avenzo' not in title.group(1).lower():
                  raise RuntimeError('Homepage identity check failed; nothing saved')
              # Do not redistribute embedded font files as part of a text snapshot.
              if re.search(r'data:(?:font/|application/(?:font|x-font)|[^;,]*(?:woff|ttf|otf))', html, flags=re.I):
                  raise RuntimeError('Embedded font data detected; snapshot stopped')
              observed = {'checked_at_utc': datetime.now(timezone.utc).isoformat(), 'source_url': URL, 'final_url': final_url, 'status': status, 'title': title.group(1), 'sha256': hashlib.sha256(data).hexdigest(), 'bytes': len(data), 'scope': 'Public homepage HTML snapshot only. Not original project source; referenced assets are not copied. No hosting, DNS, mailbox or scheduled task changes.'}
              saved = [save('recovery/published-homepage.html', data), save('recovery/published-homepage-observation.json', (json.dumps(observed, indent=2) + '\n').encode())]
              print(json.dumps({'observation': observed, 'saved': saved}, indent=2))
          
          if __name__ == '__main__':
              main()
          PY
