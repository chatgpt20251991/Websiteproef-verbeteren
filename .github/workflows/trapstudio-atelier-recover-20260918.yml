name: TrapStudio Atelier recover verified originals
on:
  push:
    branches: ['trapstudio-atelier-20260918']
    paths: ['.github/workflows/trapstudio-atelier-recover-20260918.yml']
permissions:
  contents: read
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: trapstudio-atelier-complete-35293833265
          path: source
          run-id: 35293833265
          github-token: ${{ github.token }}
      - name: Preserve metadata and split originals into download-sized collections
        run: |
          python - <<'PY'
          import json, shutil
          from pathlib import Path
          p=Path('source')
          for f in p.glob('*.json'):
              Path('metadata').mkdir(exist_ok=True)
              shutil.copy2(f,Path('metadata')/f.name)
          for i,f in enumerate(sorted(p.glob('*.png'))):
              d=Path('part-'+str(i//20));d.mkdir(exist_ok=True)
              shutil.copy2(f,d/f.name)
          print((p/'completion-variants.json').read_text())
          for f in p.glob('*-error.json'): print(f.name, f.read_text())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-metadata
          path: metadata/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-originals-part-0
          path: part-0/
          compression-level: 0
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-originals-part-1
          path: part-1/
          compression-level: 0
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: atelier-originals-part-2
          path: part-2/
          compression-level: 0
          retention-days: 90
